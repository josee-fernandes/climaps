name: Android preview APK

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Build Android preview (APK)
        id: eas
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          cat eas-build.json

          STATUS="$(jq -r '.[0].status' eas-build.json)"
          URL="$(jq -r '.[0].artifacts.applicationArchiveUrl' eas-build.json)"

          if [ "$STATUS" != "FINISHED" ] || [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "EAS build failed or APK URL is missing (status=$STATUS)"
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -fsSL "${{ steps.eas.outputs.url }}" -o climaps-preview.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: Preview ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: climaps-preview.apk
